name: Build Work Log Index

on:
  push:
    branches:
      - main
    paths:
      - "reports/**/*.html"
      - "tools/build_index.py"
      - ".github/workflows/build-worklog-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worklog-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-index:
    name: Rebuild index.json
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Build Work Log index
        run: python3 tools/build_index.py

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore(worklog): rebuild index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
